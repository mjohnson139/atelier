[project]
name = "atelier-kit"
version = "0.0.0"
description = "The Atelier drawing kit: declarative specs in, deterministic SVG out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://mjohnson139.github.io/atelier/"
Repository = "https://github.com/mjohnson139/atelier"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit/atelier_kit"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["kit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["kit/atelier_kit", "kit/tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["kit/tests"]
addopts = "-ra --strict-markers"
