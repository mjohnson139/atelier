name: Bug
description: Something is wrong
title: "fix: "
labels: [fix]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Attach the spec and the rendered image if it is a drawing problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Commit or version
