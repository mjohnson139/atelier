<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Source for social-preview.png. Render: NODE_PATH="$(npm root -g)" node scripts/render-social-preview.mjs (local Chromium). -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2f5bd3" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <style>
      @font-face{font-family:"Bricolage Grotesque";font-weight:200 800;src:url(fonts/bricolage-grotesque-latin.woff2) format("woff2")}
      @font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(fonts/ibm-plex-mono-500-latin.woff2) format("woff2")}
      @font-face{font-family:"IBM Plex Sans";font-weight:100 700;src:url(fonts/ibm-plex-sans-latin.woff2) format("woff2")}
      .eyebrow{font:500 22px "IBM Plex Mono",monospace;letter-spacing:.14em;fill:#5a6475}
      .title{font:800 132px "Bricolage Grotesque",sans-serif;letter-spacing:-3px;fill:#18202e}
      .tag{font:400 40px "IBM Plex Sans",sans-serif;fill:#18202e}
      .role{font:500 22px "IBM Plex Mono",monospace;fill:#5a6475}
    </style>
  </defs>
  <rect width="1280" height="640" fill="#f6f8fb"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <!-- A small board: one sketch per perspective -->
  <g fill="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="800" y="110" width="170" height="130" rx="10" stroke="#b8336a"/>
    <rect x="818" y="128" width="134" height="18" rx="4" fill="none" stroke="#b8336a" stroke-opacity=".6"/>
    <rect x="818" y="156" width="62" height="66" rx="4" fill="none" stroke="#b8336a" stroke-opacity=".6"/>
    <rect x="890" y="156" width="62" height="30" rx="4" fill="none" stroke="#b8336a" stroke-opacity=".6"/>
    <rect x="990" y="110" width="170" height="130" rx="10" stroke="#2f5bd3"/>
    <rect x="1010" y="135" width="44" height="30" rx="4" fill="none" stroke="#2f5bd3" stroke-opacity=".6"/>
    <rect x="1096" y="135" width="44" height="30" rx="4" fill="none" stroke="#2f5bd3" stroke-opacity=".6"/>
    <rect x="1053" y="190" width="44" height="30" rx="4" fill="none" stroke="#2f5bd3" stroke-opacity=".6"/>
    <path d="M1054 150H1096M1032 165L1062 190M1118 165L1088 190" fill="none" stroke="#2f5bd3" stroke-opacity=".6"/>
    <rect x="800" y="260" width="170" height="130" rx="10" stroke="#1d7f55"/>
    <circle cx="885" cy="285" r="9" fill="none" stroke="#1d7f55" stroke-opacity=".6"/>
    <circle cx="845" cy="330" r="9" fill="none" stroke="#1d7f55" stroke-opacity=".6"/>
    <circle cx="925" cy="330" r="9" fill="none" stroke="#1d7f55" stroke-opacity=".6"/>
    <circle cx="845" cy="370" r="9" fill="none" stroke="#1d7f55" stroke-opacity=".6"/>
    <circle cx="925" cy="370" r="9" fill="none" stroke="#1d7f55" stroke-opacity=".6"/>
    <path d="M878 292L852 323M892 292L918 323M845 339V361M925 339V361" fill="none" stroke="#1d7f55" stroke-opacity=".6"/>
    <rect x="990" y="260" width="170" height="130" rx="10" stroke="#a86f00"/>
    <g stroke="none">
      <rect x="1010" y="278" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".15"/><rect x="1045" y="278" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".3"/><rect x="1080" y="278" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".55"/><rect x="1115" y="278" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".9"/>
      <rect x="1010" y="303" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".1"/><rect x="1045" y="303" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".2"/><rect x="1080" y="303" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".4"/><rect x="1115" y="303" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".7"/>
      <rect x="1010" y="328" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".05"/><rect x="1045" y="328" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".12"/><rect x="1080" y="328" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".25"/><rect x="1115" y="328" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".45"/>
      <rect x="1010" y="353" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".04"/><rect x="1045" y="353" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".08"/><rect x="1080" y="353" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".15"/><rect x="1115" y="353" width="30" height="20" rx="3" fill="#a86f00" fill-opacity=".3"/>
    </g>
  </g>
  <text x="96" y="150" class="eyebrow">OPEN SOURCE · CLAUDE CODE · PYTHON</text>
  <text x="90" y="290" class="title">Atelier</text>
  <text x="96" y="370" class="tag">A studio of AI perspectives</text>
  <text x="96" y="422" class="tag">that draw your software.</text>
  <g>
    <rect x="96"  y="490" width="196" height="10" rx="5" fill="#b8336a"/>
    <rect x="308" y="490" width="196" height="10" rx="5" fill="#2f5bd3"/>
    <rect x="520" y="490" width="196" height="10" rx="5" fill="#1d7f55"/>
    <rect x="732" y="490" width="196" height="10" rx="5" fill="#a86f00"/>
    <rect x="944" y="490" width="196" height="10" rx="5" fill="#4a5263"/>
    <text x="96"  y="540" class="role">designer</text>
    <text x="308" y="540" class="role">architect</text>
    <text x="520" y="540" class="role">implementer</text>
    <text x="732" y="540" class="role">tester</text>
    <text x="944" y="540" class="role">curator</text>
  </g>
</svg>
